name: Build and deploy to Plesk

on:
  push:
    branches: [develop17.11.2026]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run database migration"
        type: boolean
        default: true

concurrency:
  group: deploy-plesk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Placeholder only: generating the client does not connect to the database.
          DATABASE_URL: mysql://build:build@localhost:3306/build

      - name: Build Next.js app
        run: npx next build
        env:
          # Baked into the client bundle at build time, so it must be set here.
          NEXT_PUBLIC_BASE_PATH: ${{ secrets.NEXT_PUBLIC_BASE_PATH }}
          DATABASE_URL: mysql://build:build@localhost:3306/build

      - name: Package release (production dependencies only)
        run: |
          npm ci --omit=dev
          tar -czf release.tar.gz .next public prisma node_modules package.json package-lock.json next.config.js scripts/migrate.sh

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          port: ${{ secrets.PLESK_SSH_PORT || 22 }}
          source: release.tar.gz
          target: ${{ secrets.PLESK_APP_PATH }}

      - name: Install release on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          RUN_MIGRATIONS: ${{ (github.event_name == 'push' || inputs.run_migrations) && '1' || '0' }}
          RESTART_CMD: ${{ secrets.PLESK_RESTART_CMD }}
        with:
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          port: ${{ secrets.PLESK_SSH_PORT || 22 }}
          envs: RUN_MIGRATIONS,RESTART_CMD
          script: |
            # node/npm must be on PATH for non-interactive SSH sessions (see README).
            set -euo pipefail
            cd "${{ secrets.PLESK_APP_PATH }}"

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing on the server."
              exit 1
            fi

            # Replace the previous build. .env is not in the archive, so it is kept.
            rm -rf .next public prisma node_modules scripts/migrate.sh
            tar -xzf release.tar.gz
            rm -f release.tar.gz

            if [ "$RUN_MIGRATIONS" = "1" ]; then
              bash scripts/migrate.sh
            fi

            if [ -n "$RESTART_CMD" ]; then
              eval "$RESTART_CMD"
            elif command -v pm2 >/dev/null 2>&1 && pm2 describe fast-reading-app >/dev/null 2>&1; then
              pm2 restart fast-reading-app
            else
              echo "WARNING: no restart configured. Set PLESK_RESTART_CMD or restart the Node.js app in Plesk."
            fi

            echo "Release installed."
